[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bottom-50-tax-analysis"
version = "0.1.0"
description = "Analysis of federal income tax burden by income percentile using PolicyEngine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" },
]
keywords = ["tax", "policy", "microsimulation", "policyengine"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
sim = [
    "policyengine-us>=1.0,<2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bottom50-generate = "bottom_50_tax_analysis.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/bottom-50-tax-analysis"
Repository = "https://github.com/PolicyEngine/bottom-50-tax-analysis"

[tool.hatch.build.targets.wheel]
packages = ["src/bottom_50_tax_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires policyengine-us microdata (skipped by default in CI)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
