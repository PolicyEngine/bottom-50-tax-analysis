name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install package
        run: uv pip install --system -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run pytest
        run: pytest --cov=bottom_50_tax_analysis --cov-report=term-missing
      - name: Generate fallback results.json
        run: bottom50-generate --output data/results.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install Python package (for data generation)
        run: uv pip install --system -e .
      - name: Regenerate frontend data (fallback mode)
        run: |
          bottom50-generate --output data/results.json
          cp data/results.json frontend/data/results.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: bun run lint
      - name: Build frontend
        working-directory: frontend
        run: bun run build
